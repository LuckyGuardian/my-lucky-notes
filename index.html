<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucky Note</title>

  <!-- Firebase 8.x 雲端資料庫 SDK (用於跨裝置同步) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-main: #f7f5f0;
      --bg-panel: rgba(255, 255, 255, 0.95);
      --bg-card: #ffffff;
      --accent-green: #3b5a45;
      --accent-blue: #2b5b84;
      --accent-red: #a84842;
      --text-main: #2b332c;
      --text-sub: #6e776f;
      --border-color: #e5e0d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg-main); color: var(--text-main); overflow: hidden; padding: 6px; gap: 8px; }

    .mobile-header { display: none; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 12px; justify-content: space-between; align-items: center; width: 100%; }
    .mobile-header h2 { font-size: 1rem; color: var(--accent-green); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-hamburger { background: transparent; border: none; font-size: 1.3rem; cursor: pointer; }

    .sidebar { width: 220px; background: var(--bg-panel); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border-color); overflow-y: auto; z-index: 100; transition: width 0.3s ease, padding 0.3s ease, transform 0.3s ease; position: relative; }
    .sidebar.collapsed { width: 56px; padding: 10px 6px; }
    .sidebar.collapsed .mascot-title,
    .sidebar.collapsed .sidebar-section-title,
    .sidebar.collapsed .menu-text,
    .sidebar.collapsed .btn-side-add-text,
    .sidebar.collapsed .btn-add-folder { display: none; }
    .sidebar.collapsed .menu-item { justify-content: center; padding: 8px 0; }
    .sidebar.collapsed .btn-side-add { padding: 8px 0; }

    .btn-toggle-collapse { position: absolute; top: 8px; right: 8px; background: transparent; border: none; font-size: 0.85rem; cursor: pointer; color: var(--text-sub); }
    
    .mascot-box { display: flex; align-items: center; gap: 8px; padding: 4px 4px; border-bottom: 1px solid var(--border-color); margin-bottom: 2px; cursor: pointer; transition: opacity 0.2s; }
    .mascot-box:hover { opacity: 0.8; }
    .mascot-svg { width: 34px; height: 38px; flex-shrink: 0; }
    .mascot-title { font-size: 1.05rem; font-weight: bold; color: var(--accent-green); white-space: nowrap; }

    .sidebar-section-title-box { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 1px; padding-left: 6px; padding-right: 4px; }
    .sidebar-section-title { font-size: 0.78rem; color: var(--text-sub); font-weight: bold; white-space: nowrap; }
    .btn-add-folder { background: transparent; border: none; font-size: 0.85rem; cursor: pointer; color: var(--accent-green); font-weight: bold; }

    .menu-group { display: flex; flex-direction: column; gap: 2px; }
    .menu-item { padding: 6px 10px; border-radius: 6px; cursor: grab; color: var(--text-main); font-size: 0.88rem; font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: 0.2s; user-select: none; }
    .menu-item:active { cursor: grabbing; }
    .menu-item.dragging { opacity: 0.4; background: #eee9e0; border: 1px dashed var(--accent-green); }
    .menu-item:hover, .menu-item.active { background: #eee9e0; color: var(--accent-green); font-weight: bold; }
    
    .btn-side-add { background: var(--accent-green); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 4px rgba(59,90,69,0.15); margin: 2px 0; white-space: nowrap; }
    .btn-side-add:hover { opacity: 0.9; }

    .menu-item.export-btn { color: var(--accent-blue); background: #e0e7ff; cursor: pointer; }
    .menu-item.export-btn:hover { background: #c7d2fe; }

    .main-container { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; position: relative; }
    
    .current-status-bar { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
    .btn-back-page { background: #ffffff; border: 1px solid var(--border-color); border-radius: 6px; padding: 3px 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: var(--accent-green); display: flex; align-items: center; gap: 4px; }
    .btn-back-page:hover { background: #eee9e0; }
    .status-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); }

    .dashboard-view { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

    .dashboard-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; }
    .board-card { background: var(--bg-panel); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 100%; }
    
    .board-header { padding: 8px 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .board-title { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; font-weight: bold; color: var(--accent-green); }
    .btn-board-add { background: #ffffff; border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: var(--accent-green); transition: 0.2s; }
    .btn-board-add:hover { background: var(--accent-green); color: white; border-color: var(--accent-green); }

    .card-list { padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
    
    .item-card { background: var(--bg-card); border-radius: 6px; border: 1px solid var(--border-color); padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: grab; transition: 0.2s; user-select: none; }
    .item-card:active { cursor: grabbing; }
    .item-card.dragging { opacity: 0.4; border: 2px dashed var(--accent-green); }
    .item-card:hover { border-color: var(--accent-green); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .item-card-header { display: flex; align-items: center; gap: 6px; }
    .item-card-title { font-size: 0.9rem; font-weight: bold; flex: 1; }

    .editor-view { display: none; flex: 1; flex-direction: column; background: var(--bg-panel); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--border-color); overflow: hidden; }
    .editor-tools { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .btn-tool { background: #ffffff; border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem; outline: none; }
    .btn-tool:hover { background-color: #f3f0e6; }
    
    .btn-voice { background-color: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .btn-voice.recording { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .input-title { background: transparent; border: none; border-bottom: 2px solid var(--border-color); color: var(--accent-green); font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; outline: none; width: 100%; }
    
    .input-content-editable { 
      flex: 1; 
      background: white; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 12px; 
      font-size: 1rem; 
      line-height: 1.7; 
      outline: none; 
      overflow-y: auto; 
      overflow-x: hidden; 
      white-space: pre-wrap; 
      word-break: break-word; 
      overflow-wrap: anywhere; 
    }
    .input-content-editable:focus { border-color: var(--accent-green); }

    .image-section { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border-color); }
    .image-preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .image-preview-box { position: relative; width: 75px; height: 75px; border-radius: 6px; border: 1px solid var(--border-color); overflow: hidden; cursor: pointer; }
    .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .btn-delete-img { position: absolute; top: 2px; right: 2px; background: rgba(168,72,66,0.85); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; font-size: 0.7rem; z-index: 2; }

    /* 📅 行事曆 View 樣式 */
    .calendar-view { display: none; flex: 1; flex-direction: column; background: var(--bg-panel); border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); overflow-y: auto; gap: 10px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .calendar-controls { display: flex; align-items: center; gap: 6px; }
    .btn-cal-month { background: white; border: 1px solid var(--border-color); padding: 3px 8px; border-radius: 5px; cursor: pointer; font-weight: bold; color: var(--accent-green); font-size: 0.8rem; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .cal-day-header { font-weight: bold; color: var(--accent-green); padding: 6px; background: #eee9e0; border-radius: 5px; font-size: 0.85rem; }
    .cal-day-cell { background: white; border: 1px solid var(--border-color); border-radius: 6px; min-height: 75px; padding: 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; transition: 0.2s; position: relative; }
    .cal-day-cell.empty { background: transparent; border: none; cursor: default; }
    .cal-day-cell:not(.empty):hover { border-color: var(--accent-green); background-color: #faf8f5; }
    .cal-day-cell.today { border: 2px solid var(--accent-green); background-color: #f4f8f5; }
    .cal-day-cell.selected { border: 2px solid var(--accent-blue); background-color: #e0e7ff; }
    
    .cal-day-num { font-weight: bold; font-size: 0.8rem; color: var(--text-sub); }
    .cal-holiday { background: #fee2e2; color: #991b1b; font-size: 0.65rem; padding: 1px 3px; border-radius: 3px; font-weight: bold; }
    .cal-event-tag { background: #e0e7ff; color: #2b5b84; font-size: 0.68rem; padding: 1px 3px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; cursor: pointer; display: block; }
    
    .cal-dots-box { display: none; gap: 3px; justify-content: center; margin-top: 2px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
    .cal-dot.event { background-color: var(--accent-blue); }
    .cal-dot.holiday { background-color: var(--accent-red); }

    /* 📱 手機版專用：每日行程下方展開清單區 */
    .mobile-day-agenda { display: none; background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-top: 6px; flex-direction: column; gap: 6px; }
    .mobile-agenda-title { font-size: 0.9rem; font-weight: bold; color: var(--accent-green); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .mobile-agenda-item { background: #f7f5f0; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color: var(--accent-blue); cursor: pointer; border: 1px solid var(--border-color); display: flex; justify-content: space-between; }

    .fab-btn { display: none; position: fixed; bottom: 16px; right: 16px; width: 50px; height: 50px; background: var(--accent-green); color: white; border-radius: 50%; border: none; font-size: 1.6rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; z-index: 99; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 9999; justify-content: center; align-items: center; }
    .modal-box { background: #ffffff; width: 90%; max-width: 450px; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    
    .img-lightbox-box { position: relative; max-width: 90vw; max-height: 90vh; display: flex; justify-content: center; align-items: center; }
    .img-lightbox-box img { max-width: 100%; max-height: 85vh; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

    @media (max-width: 768px) {
      body { flex-direction: column; padding: 4px; gap: 4px; }
      .mobile-header { display: flex; }
      .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 250px; transform: translateX(-100%); box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
      .sidebar.open { transform: translateX(0); }
      
      .dashboard-grid { grid-template-columns: 1fr; }
      .fab-btn { display: flex; justify-content: center; align-items: center; }
      .editor-view { padding: 8px 10px; }
      .input-content-editable { padding: 8px; font-size: 0.95rem; }

      /* 📱 手機版行事曆切換為「極簡點陣月曆 + 下方每日行程清單」 */
      .calendar-view { padding: 6px; gap: 6px; }
      .calendar-grid { gap: 2px; }
      .cal-day-header { padding: 3px 0; font-size: 0.7rem; border-radius: 3px; }
      .cal-day-cell { min-height: 40px; padding: 2px; gap: 1px; border-radius: 4px; align-items: center; justify-content: flex-start; }
      .cal-day-num { font-size: 0.75rem; }
      .cal-holiday, .cal-event-tag { display: none !important; } /* 手機上隱藏卡片標籤 */
      .cal-dots-box { display: flex; } /* 顯示精緻小點 */
      .mobile-day-agenda { display: flex; } /* 顯示下方行程列表區域 */
    }
  </style>
</head>
<body>

  <!-- 手機版 Header -->
  <div class="mobile-header">
    <h2 onclick="goHome()">
      <svg class="mascot-svg" style="width:24px;height:24px;" viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="38" fill="#f4bb44" />
        <polygon points="20,15 38,30 12,42" fill="#e59b2b" />
        <polygon points="80,15 62,30 88,42" fill="#e59b2b" />
        <polygon points="24,22 34,30 18,38" fill="#ffcdd2" />
        <polygon points="76,22 66,30 82,38" fill="#ffcdd2" />
        <ellipse cx="50" cy="65" rx="18" ry="14" fill="#ffffff" />
        <ellipse cx="36" cy="48" rx="4" ry="5" fill="#2c2a29" />
        <ellipse cx="64" cy="48" rx="4" ry="5" fill="#2c2a29" />
        <circle cx="38" cy="46" r="1.5" fill="#ffffff" />
        <circle cx="66" cy="46" r="1.5" fill="#ffffff" />
        <polygon points="50,56 46,60 54,66" fill="#e59b2b" />
        <path d="M44,63 Q50,67 56,63" stroke="#2c2a29" stroke-width="2" fill="none" stroke-linecap="round" />
        <circle cx="26" cy="58" r="5" fill="#ff8a80" opacity="0.6" />
        <circle cx="74" cy="58" r="5" fill="#ff8a80" opacity="0.6" />
      </svg>
      Lucky Note
    </h2>
    <button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
  </div>

  <!-- 左側選單 -->
  <div class="sidebar" id="sidebar">
    <button class="btn-toggle-collapse" id="collapseBtn" onclick="toggleSidebarCollapse()" title="收起/展開側邊欄">◀</button>

    <div class="mascot-box" onclick="goHome()" title="點擊回到全部看板">
      <svg class="mascot-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="38" fill="#f4bb44" />
        <polygon points="20,15 38,30 12,42" fill="#e59b2b" />
        <polygon points="80,15 62,30 88,42" fill="#e59b2b" />
        <polygon points="24,22 34,30 18,38" fill="#ffcdd2" />
        <polygon points="76,22 66,30 82,38" fill="#ffcdd2" />
        <ellipse cx="50" cy="65" rx="18" ry="14" fill="#ffffff" />
        <ellipse cx="36" cy="48" rx="4" ry="5" fill="#2c2a29" />
        <ellipse cx="64" cy="48" rx="4" ry="5" fill="#2c2a29" />
        <circle cx="38" cy="46" r="1.5" fill="#ffffff" />
        <circle cx="66" cy="46" r="1.5" fill="#ffffff" />
        <polygon points="50,56 46,60 54,60" fill="#e59b2b" />
        <path d="M44,63 Q50,67 56,63" stroke="#2c2a29" stroke-width="2" fill="none" stroke-linecap="round" />
        <circle cx="26" cy="58" r="5" fill="#ff8a80" opacity="0.6" />
        <circle cx="74" cy="58" r="5" fill="#ff8a80" opacity="0.6" />
        <line x1="10" y1="52" x2="24" y2="54" stroke="#e59b2b" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="60" x2="25" y2="60" stroke="#e59b2b" stroke-width="2" stroke-linecap="round" />
        <line x1="90" y1="52" x2="76" y2="54" stroke="#e59b2b" stroke-width="2" stroke-linecap="round" />
        <line x1="88" y1="60" x2="75" y2="60" stroke="#e59b2b" stroke-width="2" stroke-linecap="round" />
      </svg>
      <div class="mascot-title">Lucky Note</div>
    </div>

    <button class="btn-side-add" onclick="openQuickAddModal(); toggleSidebar();">
      ➕ <span class="btn-side-add-text">快速新增卡片</span>
    </button>

    <div class="sidebar-section-title-box">
      <span class="sidebar-section-title">快速跳轉</span>
    </div>
    <div class="menu-group">
      <div class="menu-item" style="cursor:pointer;" onclick="openSearchModal(); toggleSidebar();">🔍 <span class="menu-text">搜尋</span></div>
      <div class="menu-item" style="cursor:pointer;" onclick="openTagModal(); toggleSidebar();">🏷️ <span class="menu-text">Tag 瀏覽</span></div>
      <div class="menu-item" style="cursor:pointer;" id="menu-cal" onclick="switchView('calendar', '📅 行事曆'); updateMenuActive('menu-cal'); toggleSidebar();">📅 <span class="menu-text">行事曆</span></div>
      <div class="menu-item export-btn" onclick="openExportModal(); toggleSidebar();">📥 <span class="menu-text">匯出資料 (自訂/全站)</span></div>
    </div>

    <div class="sidebar-section-title-box">
      <span class="sidebar-section-title">新增筆記 (可拖曳排序)</span>
      <button class="btn-add-folder" onclick="addNewFolder()" title="新增資料夾/分類看板">➕</button>
    </div>
    <div class="menu-group" id="categoryMenuGroup">
      <div class="menu-item" draggable="true" data-target-board="ai-board" id="menu-ai" onclick="openNewCategoryNote('🤖 AI 智庫與筆記'); updateMenuActive('menu-ai'); toggleSidebar();">🤖 <span class="menu-text">AI 智庫與筆記</span></div>
      <div class="menu-item" draggable="true" data-target-board="work-board" id="menu-work" onclick="openNewCategoryNote('💼 工作任務'); updateMenuActive('menu-work'); toggleSidebar();">💼 <span class="menu-text">工作任務</span></div>
      <div class="menu-item" draggable="true" data-target-board="todo-board" id="menu-todo" onclick="openNewCategoryNote('☑️ 待辦事項'); updateMenuActive('menu-todo'); toggleSidebar();">☑️ <span class="menu-text">待辦事項</span></div>
      <div class="menu-item" draggable="true" data-target-board="learn-board" id="menu-learn" onclick="openNewCategoryNote('📖 學習筆記'); updateMenuActive('menu-learn'); toggleSidebar();">📖 <span class="menu-text">學習筆記</span></div>
      <div class="menu-item" draggable="true" data-target-board="web-board" id="menu-web" onclick="openNewCategoryNote('🌐 網路知識收集站'); updateMenuActive('menu-web'); toggleSidebar();">🌐 <span class="menu-text">網路知識收集站</span></div>
    </div>
  </div>

  <!-- 主內容區 -->
  <div class="main-container">

    <div class="current-status-bar">
      <button class="btn-back-page" onclick="history.back()">⬅️ 返回上一頁</button>
      <span class="status-title" id="currentStatusText">🌐 全部看板模式</span>
    </div>

    <!-- 視窗 1：看板模式 -->
    <div class="dashboard-view" id="view-dashboard">
      <div class="dashboard-grid" id="dashboardGrid">
        <div class="board-card" id="ai-board">
          <div class="board-header">
            <div class="board-title">🤖 AI 智庫與筆記</div>
            <button class="btn-board-add" onclick="openNewCategoryNote('🤖 AI 智庫與筆記')">+ 新增</button>
          </div>
          <div class="card-list" id="list-ai"></div>
        </div>

        <div class="board-card" id="work-board">
          <div class="board-header">
            <div class="board-title">💼 工作任務</div>
            <button class="btn-board-add" onclick="openNewCategoryNote('💼 工作任務')">+ 新增</button>
          </div>
          <div class="card-list" id="list-work"></div>
        </div>

        <div class="board-card" id="todo-board">
          <div class="board-header">
            <div class="board-title">☑️ 待辦事項</div>
            <button class="btn-board-add" onclick="openNewCategoryNote('☑️ 待辦事項')">+ 新增</button>
          </div>
          <div class="card-list" id="list-todo"></div>
        </div>

        <div class="board-card" id="learn-board">
          <div class="board-header">
            <div class="board-title">📖 學習筆記</div>
            <button class="btn-board-add" onclick="openNewCategoryNote('📖 學習筆記')">+ 新增</button>
          </div>
          <div class="card-list" id="list-learn"></div>
        </div>

        <div class="board-card" id="web-board">

  <script>
    /* 🔥 Firebase 雲端資料庫初始化 (填入您的 Config 即可開啟跨裝置同步) */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    let isFirebaseEnabled = false;

    // 嘗試初始化 Firebase，若尚未設定則自動降級為 LocalStorage 本地儲存
    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseEnabled = true;
        console.log("🔥 Firebase 雲端同步已成功開啟！");
      }
    } catch(e) {
      console.warn("⚠️ Firebase 未設定，將使用本機 LocalStorage 儲存。");
    }

    const whitelistEmails = ['n29560408@gmail.com', 'n29560408@cdc.gov.tw'];

    let currentImages = [];
    let currentEditingNoteId = null;
    let notesData = [];
    let selectedDateStr = '';

    let calYear = 2026;
    let calMonth = 8; // 0-based

    const webTemplate = `🌐 [文章或知識標題]\n\n【一、 基本資訊】\n* 來源網址：https://...\n* 主題標籤：#科技 #股票 #心理\n\n【二、 核心重點摘要】\n* 重點 1：\n* 重點 2：\n\n【三、 個人心得與應用】\n* 我的思考：`;
    const meetingTemplate = `⏰ [會議/活動名稱]\n\n【一、 基本資訊與地點】\n* 時間：14:00 - 15:00\n* 地點：實體 302 會議室 / 線上 Teams\n* 主持人：Headquarter.ai 團隊\n\n【二、 會前準備與攜帶物品】\n[ ] 準備專案簡報檔 (PPT)\n[ ] 帶筆電與簡報筆`;
    const aiTemplate = `🤖 [ChatGPT 萬用文案潤飾 Prompt]\n\n【一、 核心提示詞 (Prompt Template)】\n* 角色設定：你是一位專業的職場溝通專家。\n* 任務目標：幫我潤飾以下內文，使其兼具專業度與道地表達。\n* 輸入內容：[在此貼入原始文字]`;
    const workTemplate = `📌 [會議/專案名稱] 紀錄\n\n【一、 核心目標與結論】\n* 本次要解決的核心問題：\n* 最終決議與共識：\n\n【二、 Action Items (待辦追蹤)】\n[ ] 任務 A (負責人 / 預計完成日)`;
    const englishTemplate = `🔤 [英文句型與搭配詞指南]\n\n【一、 萬用句型 / 情境短語】\n* 句型 1：I wanted to check in on the status of [事項].`;
    const todoTemplate = `☑️ [待辦事項標題]\n\n【一、 任務細節說明】\n* 相關連結/資料：\n* 預計完成時間：`;

    const taiwanHolidays = {
      "01-01": "元旦",
      "02-28": "和平紀念日",
      "04-04": "兒童節",
      "04-05": "清明節",
      "05-01": "勞動節",
      "09-25": "🥮 中秋節",
      "09-28": "🎓 教師節",
      "10-10": "國慶日"
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadNotesData();
      initDragAndDrop();
      initCategoryMenuDragAndDrop();

      const today = new Date();
      calYear = today.getFullYear();
      calMonth = today.getMonth();

      renderCalendar(calYear, calMonth);

      const editorEl = document.getElementById('noteContent');
      if (editorEl) {
        editorEl.addEventListener('paste', (e) => {
          const items = (e.clipboardData || e.originalEvent.clipboardData).items;
          for (let item of items) {
            if (item.type.indexOf('image') === 0) {
              e.preventDefault();
              const file = item.getAsFile();
              const reader = new FileReader();
              reader.onload = (event) => {
                document.execCommand('insertImage', false, event.target.result);
                currentImages.push(event.target.result);
                renderImages();
              };
              reader.readAsDataURL(file);
            }
          }
        });

        editorEl.addEventListener('click', (e) => {
          if (e.target.tagName === 'IMG') {
            openLightbox(e.target.src);
          }
        });
      }
    });

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxModal').style.display = 'flex';
    }
    function closeLightbox() {
      document.getElementById('lightboxModal').style.display = 'none';
    }

    /* 雲端 / 本地資料雙軌讀取機制 */
    function loadNotesData() {
      if (isFirebaseEnabled && db) {
        db.collection("luckynotes").onSnapshot((snapshot) => {
          notesData = [];
          snapshot.forEach((doc) => {
            notesData.push({ id: doc.id, ...doc.data() });
          });
          renderDashboardCards();
          renderCalendar(calYear, calMonth);
        }, (error) => {
          console.error("Firebase 讀取失敗：", error);
          loadNotesFromLocalStorage();
        });
      } else {
        loadNotesFromLocalStorage();
      }
    }

    function loadNotesFromLocalStorage() {
      const saved = localStorage.getItem('luckynote_data');
      if (saved) {
        try {
          notesData = JSON.parse(saved);
        } catch(e) {
          notesData = getInitialDemoData();
        }
      } else {
        notesData = getInitialDemoData();
        saveNotesToLocalStorage();
      }
      renderDashboardCards();
    }

    function saveNotesToLocalStorage() {
      localStorage.setItem('luckynote_data', JSON.stringify(notesData));
    }

    function getInitialDemoData() {
      return [
        {
          id: 'note-1',
          title: '☑️ 9/14設定署內Claude',
          content: '任務進度：權限申請中...\n* 時間：2026/09/14 10:00\n* 地點：署內會議室',
          category: '☑️ 待辦事項',
          dateStr: '2026-09-14',
          images: []
        },
        {
          id: 'note-2',
          title: '☑️ 9/16與Headquarter.ai討論會',
          content: meetingTemplate,
          category: '☑️ 待辦事項',
          dateStr: '2026-09-16',
          images: []
        }
      ];
    }

    function renderDashboardCards() {
      document.querySelectorAll('.card-list').forEach(el => el.innerHTML = '');

      notesData.forEach(note => {
        let listId = 'list-web';
        if (note.category.includes('AI')) listId = 'list-ai';
        else if (note.category.includes('工作')) listId = 'list-work';
        else if (note.category.includes('待辦')) listId = 'list-todo';
        else if (note.category.includes('學習')) listId = 'list-learn';

        const listEl = document.getElementById(listId);
        if (listEl) {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.setAttribute('draggable', 'true');
          bindCardDragEvents(card);
          card.onclick = () => openNoteInEditorById(note.id);
          card.innerHTML = `<div class="item-card-header"><input type="checkbox" onclick="event.stopPropagation()"><span class="item-card-title">${note.title}</span></div>`;
          listEl.prepend(card);
        }
      });
    }

    /* 📅 動態萬年曆渲染 (電腦版標籤 / 手機版點陣雙優化) */
    function renderCalendar(year, month) {
      const grid = document.getElementById('calendarGrid');
      const titleEl = document.getElementById('calTitleDisplay');
      
      grid.innerHTML = `
        <div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>
      `;

      titleEl.innerText = `📅 ${year} 年 ${month + 1} 月 行事曆`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-day-cell empty';
        grid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayCell = document.createElement('div');
        dayCell.className = 'cal-day-cell';
        
        const mStr = (month + 1 < 10 ? '0' : '') + (month + 1);
        const dStr = (day < 10 ? '0' : '') + day;
        const dateKey = `${mStr}-${dStr}`;
        const fullDateStr = `${year}-${mStr}-${dStr}`;

        if (isCurrentMonth && day === today.getDate()) {
          dayCell.classList.add('today');
        }
        if (selectedDateStr === fullDateStr) {
          dayCell.classList.add('selected');
        }

        dayCell.onclick = () => selectCalendarDay(year, month + 1, day, fullDateStr, dayCell);

        let cellHTML = `<span class="cal-day-num">${day}</span>`;
        let hasEvent = false;
        let hasHoliday = false;

        if (taiwanHolidays[dateKey]) {
          hasHoliday = true;
          cellHTML += `<span class="cal-holiday">${taiwanHolidays[dateKey]}</span>`;
        }

        // 電腦版文字標籤
        let dayEvents = [];
        notesData.forEach(note => {
          if (note.dateStr === fullDateStr) {
            hasEvent = true;
            dayEvents.push(note);
          }
        });

        // 手機版小圓點
        let dotsHTML = '<div class="cal-dots-box">';
        if (hasEvent) dotsHTML += '<span class="cal-dot event"></span>';
        if (hasHoliday) dotsHTML += '<span class="cal-dot holiday"></span>';
        dotsHTML += '</div>';

        dayCell.innerHTML = cellHTML + dotsHTML;

        // 貼上電腦版文字標籤
        dayEvents.forEach(note => {
          const eventTag = document.createElement('span');
          eventTag.className = 'cal-event-tag';
          eventTag.innerText = note.title.replace(/^⏰\s*\[\d+\/\d+\s*/, '').replace(/\]$/, '');
          eventTag.onclick = (e) => {
            e.stopPropagation();
            openNoteInEditorById(note.id);
          };
          dayCell.appendChild(eventTag);
        });

        grid.appendChild(dayCell);
      }
    }

    /* 📱 手機版點擊日期：選取日期並在下方展開每日行程清單 */
    function selectCalendarDay(year, month, day, fullDateStr, cellEl) {
      document.querySelectorAll('.cal-day-cell').forEach(el => el.classList.remove('selected'));
      cellEl.classList.add('selected');
      selectedDateStr = fullDateStr;

      const titleEl = document.getElementById('agendaDateTitle');
      const listEl = document.getElementById('agendaItemsList');
      
      const holidayName = taiwanHolidays[`${month < 10 ? '0' : ''}${month}-${day < 10 ? '0' : ''}${day}`];
      titleEl.innerText = `📌 ${year}/${month}/${day} 行程明細 ${holidayName ? '(' + holidayName + ')' : ''}`;

      const matchedNotes = notesData.filter(n => n.dateStr === fullDateStr);

      if (matchedNotes.length === 0) {
        listEl.innerHTML = `<span style="font-size:0.85rem;color:var(--text-sub);padding:4px 0;">當日尚無任何行程，點擊上方按鈕即可新增行程提醒。</span>`;
      } else {
        listEl.innerHTML = matchedNotes.map(n => `
          <div class="mobile-agenda-item" onclick="openNoteInEditorById('${n.id}')">
            <span>${n.title}</span>
            <span style="font-size:0.75rem;opacity:0.8;">編輯 ➔</span>
          </div>
        `).join('');
      }
    }

    function addNoteOnSelectedDate() {
      if (!selectedDateStr) {
        const today = new Date();
        const mStr = today.getMonth() + 1 < 10 ? '0' + (today.getMonth() + 1) : today.getMonth() + 1;
        const dStr = today.getDate() < 10 ? '0' + today.getDate() : today.getDate();
        selectedDateStr = `${today.getFullYear()}-${mStr}-${dStr}`;
      }
      const parts = selectedDateStr.split('-');
      clickCalendarDayByDate(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
    }

    function changeMonth(delta) {
      if (delta === 0) {
        const today = new Date();
        calYear = today.getFullYear();
        calMonth = today.getMonth();
      } else {
        calMonth += delta;
        if (calMonth < 0) {
          calMonth = 11;
          calYear--;
        } else if (calMonth > 11) {
          calMonth = 0;
          calYear++;
        }
      }
      renderCalendar(calYear, calMonth);
    }

    function clickCalendarDayByDate(year, month, day) {
      const mStr = month < 10 ? '0' + month : '' + month;
      const dStr = day < 10 ? '0' + day : '' + day;
      const fullDateStr = `${year}-${mStr}-${dStr}`;

      currentEditingNoteId = null;
      currentImages = [];
      renderImages();

      document.getElementById('noteCalendarDate').value = fullDateStr;
      document.getElementById('noteTitle').value = `⏰ [${month}/${dStr} 活動/會議提醒]`;
      document.getElementById('noteContent').innerHTML = `⏰ ${year}/${mStr}/${dStr} 活動與會議行程<br><br><b>【一、 基本資訊與地點】</b><br>* 時間：${year} / ${mStr} / ${dStr} 10:00 - 11:00<br>* 地點：會議室 A / 線上 Teams (連結：https://...)<br>* 主持人：專案負責人<br><br><b>【二、 內容摘要與待辦】</b><br>[ ] 準備討論資料與 PPT 簡報檔`;
      document.getElementById('editorTargetCategory').value = '☑️ 待辦事項';
      switchView('editor', `📝 新增 ${month}/${dStr} 行程提醒`);
    }

    /* 💾 儲存筆記 (支援 Firebase 雲端同步與 LocalStorage) */
    function saveEditorNote() {
      const title = document.getElementById('noteTitle').value || '未命名筆記';
      const content = document.getElementById('noteContent').innerHTML;
      const category = document.getElementById('editorTargetCategory').value;
      const dateStr = document.getElementById('noteCalendarDate').value;

      const notePayload = {
        title: title,
        content: content,
        category: category,
        dateStr: dateStr || '',
        images: [...currentImages],
        updatedAt: new Date().toISOString()
      };

      if (isFirebaseEnabled && db) {
        if (currentEditingNoteId) {
          db.collection("luckynotes").doc(currentEditingNoteId).update(notePayload)
            .then(() => alert('雲端筆記「' + title + '」已成功更新！'));
        } else {
          db.collection("luckynotes").add(notePayload)
            .then(() => alert('雲端筆記「' + title + '」已成功同步上傳！'));
        }
      } else {
        if (currentEditingNoteId) {
          const index = notesData.findIndex(n => n.id === currentEditingNoteId);
          if (index !== -1) {
            notesData[index] = { id: currentEditingNoteId, ...notePayload };
          }
          alert('本機筆記「' + title + '」已成功更新存檔！');
        } else {
          const newNote = { id: 'note-' + Date.now(), ...notePayload };
          notesData.push(newNote);
          alert('本機筆記「' + title + '」已成功新增！');
        }
        saveNotesToLocalStorage();
        renderDashboardCards();
        renderCalendar(calYear, calMonth);
      }

      currentEditingNoteId = null;
      document.getElementById('noteCalendarDate').value = '';
      showAllBoards();
      switchView('dashboard', '🌐 全部看板模式');
    }

    function deleteCurrentNote() {
      if (confirm('⚠️ 警告：確定要刪除這篇筆記嗎？刪除後將無法恢復！')) {
        if (currentEditingNoteId) {
          if (isFirebaseEnabled && db) {
            db.collection("luckynotes").doc(currentEditingNoteId).delete()
              .then(() => alert('雲端筆記已成功刪除！'));
          } else {
            notesData = notesData.filter(n => n.id !== currentEditingNoteId);
            saveNotesToLocalStorage();
            renderDashboardCards();
            renderCalendar(calYear, calMonth);
            alert('本機筆記已成功刪除！');
          }
          currentEditingNoteId = null;
        }
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').innerHTML = '';
        currentImages = [];
        renderImages();
        showAllBoards();
        switchView('dashboard', '🌐 全部看板模式');
      }
    }

    function openNoteInEditorById(noteId) {
      const note = notesData.find(n => n.id === noteId);
      if (!note) return;

      currentEditingNoteId = note.id;
      currentImages = note.images || [];
      renderImages();

      document.getElementById('noteTitle').value = note.title;
      document.getElementById('noteContent').innerHTML = note.content;
      document.getElementById('editorTargetCategory').value = note.category;
      document.getElementById('noteCalendarDate').value = note.dateStr || '';

      switchView('editor', '📝 修改筆記：' + note.title);
    }

    function initCategoryMenuDragAndDrop() {
      const menuGroup = document.getElementById('categoryMenuGroup');
      if (!menuGroup) return;

      const menuItems = menuGroup.querySelectorAll('.menu-item[draggable="true"]');
      menuItems.forEach(item => bindMenuItemDragEvents(item));

      menuGroup.addEventListener('dragover', e => {
        e.preventDefault();
        const draggingItem = menuGroup.querySelector('.dragging');
        if (!draggingItem) return;

        const afterElement = getDragAfterElement(menuGroup, e.clientY, '.menu-item:not(.dragging)');
        if (afterElement == null) {
          menuGroup.appendChild(draggingItem);
        } else {
          menuGroup.insertBefore(draggingItem, afterElement);
        }

        syncDashboardGridOrder();
      });
    }

    function bindMenuItemDragEvents(item) {
      item.addEventListener('dragstart', () => item.classList.add('dragging'));
      item.addEventListener('dragend', () => item.classList.remove('dragging'));
    }

    function syncDashboardGridOrder() {
      const menuGroup = document.getElementById('categoryMenuGroup');
      const grid = document.getElementById('dashboardGrid');
      if (!menuGroup || !grid) return;

      const items = menuGroup.querySelectorAll('.menu-item');
      items.forEach(item => {
        const targetBoardId = item.getAttribute('data-target-board');
        if (targetBoardId) {
          const boardEl = document.getElementById(targetBoardId);
          if (boardEl) grid.appendChild(boardEl);
        }
      });
    }

    function applyWebKnowledgeTemplate() {
      document.getElementById('noteTitle').value = '🌐 [網路知識文章標題]';
      document.getElementById('noteContent').innerHTML = webTemplate.replace(/\n/g, '<br>');
      document.getElementById('editorTargetCategory').value = '🌐 網路知識收集站';
    }

    function goHome() {
      showAllBoards();
      updateMenuActive('');
      switchView('dashboard', '🌐 全部看板模式');
    }

    function showAllBoards() {
      const allBoards = document.querySelectorAll('.board-card');
      allBoards.forEach(b => b.style.display = 'flex');
    }

    function addNewFolder() {
      const folderName = prompt('請輸入新資料夾/分類看板名稱 (例如：🛒 購物清單)：');
      if (!folderName) return;

      const safeId = 'custom-' + Date.now();
      
      const menuGroup = document.getElementById('categoryMenuGroup');
      const menuItem = document.createElement('div');
      menuItem.className = 'menu-item';
      menuItem.id = 'menu-' + safeId;
      menuItem.setAttribute('draggable', 'true');
      menuItem.setAttribute('data-target-board', safeId);
      bindMenuItemDragEvents(menuItem);

      menuItem.onclick = () => {
        openNewCategoryNote(folderName);
        updateMenuActive('menu-' + safeId);
        toggleSidebar();
      };
      menuItem.innerHTML = `📁 <span class="menu-text">${folderName}</span>`;
      menuGroup.appendChild(menuItem);

      const grid = document.getElementById('dashboardGrid');
      const boardCard = document.createElement('div');
      boardCard.className = 'board-card';
      boardCard.id = safeId;
      boardCard.innerHTML = `
        <div class="board-header">
          <div class="board-title">📁 ${folderName}</div>
          <button class="btn-board-add" onclick="openNewCategoryNote('${folderName}')">+ 新增</button>
        </div>
        <div class="card-list" id="list-${safeId}"></div>
      `;
      grid.appendChild(boardCard);

      const sel = document.getElementById('editorTargetCategory');
      const opt = document.createElement('option');
      opt.value = folderName;
      opt.innerText = folderName;
      sel.appendChild(opt);

      initDragAndDrop();
      alert('資料夾看板「' + folderName + '」已成功建立！');
    }

    function openNewCategoryNote(categoryName) {
      currentEditingNoteId = null;
      currentImages = [];
      renderImages();

      let defaultTitle = categoryName + ' - 新筆記';
      let tpl = todoTemplate;

      if (categoryName.includes('AI')) {
        defaultTitle = '🤖 ChatGPT 萬用文案潤飾 Prompt';
        tpl = aiTemplate;
      } else if (categoryName.includes('工作')) {
        defaultTitle = '📌 跨部門會議紀錄與進度追蹤';
        tpl = workTemplate;
      } else if (categoryName.includes('學習')) {
        defaultTitle = '📖 英文句型與搭配詞指南';
        tpl = englishTemplate;
      } else if (categoryName.includes('網路')) {
        defaultTitle = '🌐 網路知識收集文章';
        tpl = webTemplate;
      }

      document.getElementById('noteCalendarDate').value = '';
      document.getElementById('noteTitle').value = defaultTitle;
      document.getElementById('noteContent').innerHTML = tpl.replace(/\n/g, '<br>');
      document.getElementById('editorTargetCategory').value = categoryName;
      switchView('editor', '📝 新增：' + categoryName);
    }

    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.view) {
        switchView(e.state.view, e.state.statusText, false);
      } else {
        goHome();
      }
    });

    function toggleSidebarCollapse() {
      const sidebar = document.getElementById('sidebar');
      const collapseBtn = document.getElementById('collapseBtn');
      sidebar.classList.toggle('collapsed');
      collapseBtn.innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
    }

    function formatDoc(cmd, value = null) {
      document.execCommand(cmd, false, value);
    }

    function initDragAndDrop() {
      const lists = document.querySelectorAll('.card-list');
      lists.forEach(list => {
        list.addEventListener('dragover', e => {
          e.preventDefault();
          const draggingCard = document.querySelector('.dragging');
          if (!draggingCard) return;
          const afterElement = getDragAfterElement(list, e.clientY, '.item-card:not(.dragging)');
          if (afterElement == null) {
            list.appendChild(draggingCard);
          } else {
            list.insertBefore(draggingCard, afterElement);
          }
        });
      });
    }

    function bindCardDragEvents(card) {
      card.addEventListener('dragstart', () => card.classList.add('dragging'));
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    }

    function getDragAfterElement(container, y, selector) {
      const draggableElements = [...container.querySelectorAll(selector)];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function openQuickAddModal() {
      const cat = prompt('請選擇分類數字 (1:AI智庫, 2:工作任務, 3:待辦事項, 4:學習筆記, 5:網路知識)：', '3');
      const title = prompt('請輸入卡片標題 (可加 #Tag)：');
      if (!title) return;

      let catName = '☑️ 待辦事項';
      if (cat === '1') catName = '🤖 AI 智庫與筆記';
      else if (cat === '2') catName = '💼 工作任務';
      else if (cat === '4') catName = '📖 學習筆記';
      else if (cat === '5') catName = '🌐 網路知識收集站';

      const newNote = {
        id: 'note-' + Date.now(),
        title: title,
        content: '快速新增內容...',
        category: catName,
        dateStr: '',
        images: []
      };

      if (isFirebaseEnabled && db) {
        db.collection("luckynotes").add(newNote);
      } else {
        notesData.push(newNote);
        saveNotesToLocalStorage();
        renderDashboardCards();
      }

      alert('卡片「' + title + '」已成功新增！');
    }

    function applyMeetingTemplate(month = '09', day = '16') {
      document.getElementById('noteTitle').value = `⏰ [${month}/${day} 會議/活動名稱]`;
      document.getElementById('noteContent').innerHTML = meetingTemplate.replace(/\n/g, '<br>');
      document.getElementById('editorTargetCategory').value = '💼 工作任務';
    }

    function updateMenuActive(menuId) {
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(menuId);
      if (activeEl) activeEl.classList.add('active');
    }

    function openExportModal() { document.getElementById('exportModal').style.display = 'flex'; }
    function closeExportModal() { document.getElementById('exportModal').style.display = 'none'; }

    function processCustomExport() {
      const selectedChks = Array.from(document.querySelectorAll('.export-chk:checked')).map(c => c.value);
      if (selectedChks.length === 0) return alert('請至少勾選一個分類看板！');

      const userEmail = prompt('🔐 安全驗證：請輸入授權 Email 以下載匯出資料：');
      if (!userEmail) return;

      if (!whitelistEmails.includes(userEmail.trim().toLowerCase())) {
        alert('❌ 存取拒絕：您的 Email 不在允許匯出的白名單中！');
        return;
      }

      const format = document.querySelector('input[name="exportFormat"]:checked').value;
      const exportData = {
        exportedAt: new Date().toLocaleString(),
        exportedBy: userEmail,
        notes: notesData
      };

      if (format === 'json') {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = dataStr;
        downloadAnchor.download = `LuckyNote_Export_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      } else {
        let htmlCards = exportData.notes.map(n => `<div style="background:white;padding:15px;margin-bottom:10px;border-radius:8px;border:1px solid #e5e0d8;"><span style="background:#f0ebd8;padding:2px 8px;border-radius:12px;font-size:0.8rem;">${n.category}</span><h3>${n.title}</h3><div>${n.content}</div></div>`).join('');
        const htmlContent = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LuckyNote 匯出資料</title></head><body style="font-family:sans-serif;padding:20px;background:#f7f5f0;"><h2>Lucky Note 導出清單</h2>${htmlCards}</body></html>`;
        
        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = URL.createObjectURL(blob);
        downloadAnchor.download = `LuckyNote_Export_${new Date().toISOString().slice(0,10)}.html`;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

      closeExportModal();
      alert('✅ 驗證成功！資料已順利匯出。');
    }

    function exportSingleNote() {
      const userEmail = prompt('🔐 安全驗證：請輸入授權 Email 以匯出單篇筆記：');
      if (!userEmail) return;

      if (!whitelistEmails.includes(userEmail.trim().toLowerCase())) {
        alert('❌ 存取拒絕：您的 Email 不在允許匯出的白名單中！');
        return;
      }

      const title = document.getElementById('noteTitle').value || 'LuckyNote_Export';
      const content = document.getElementById('noteContent').innerHTML;
      const category = document.getElementById('editorTargetCategory').value;

      const htmlContent = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f7f5f0; color: #2b332c; line-height: 1.8; }
    .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e0d8; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { color: #3b5a45; border-bottom: 2px solid #e5e0d8; padding-bottom: 8px; font-size: 1.4rem; }
    .tag { display: inline-block; background: #f0ebd8; color: #6b5e43; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; }
    .content { font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">${category}</span>
    <h1>${title}</h1>
    <div class="content">${content}</div>
  </div>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = URL.createObjectURL(blob);
      downloadAnchor.download = `${title}.html`;
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();

      alert('✅ 單篇筆記已成功匯出為 HTML 檔案！');
    }

    function switchView(viewName, statusText, pushState = true) {
      const dash = document.getElementById('view-dashboard');
      const edit = document.getElementById('view-editor');
      const cal = document.getElementById('view-calendar');
      const statusEl = document.getElementById('currentStatusText');

      dash.style.display = 'none';
      edit.style.display = 'none';
      cal.style.display = 'none';

      if (viewName === 'dashboard') {
        dash.style.display = 'flex';
        statusEl.innerText = statusText || '🌐 全部看板模式';
      } else if (viewName === 'editor') {
        edit.style.display = 'flex';
        statusEl.innerText = statusText || '📝 筆記詳細編輯模式';
      } else if (viewName === 'calendar') {
        cal.style.display = 'flex';
        statusEl.innerText = statusText || '📅 行事曆';
      }

      if (pushState) {
        history.pushState({ view: viewName, statusText: statusText }, '', '#' + viewName);
      }
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.execCommand('insertImage', false, e.target.result);
          currentImages.push(e.target.result);
          renderImages();
        };
        reader.readAsDataURL(file);
      }
    }

    function renderImages() {
      const container = document.getElementById('imageContainer');
      container.innerHTML = '';
      currentImages.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'image-preview-box';
        box.onclick = () => openLightbox(src);
        box.innerHTML = `<img src="${src}"><button class="btn-delete-img" onclick="event.stopPropagation(); currentImages.splice(${idx},1); renderImages();">✕</button>`;
        container.appendChild(box);
      });
    }

    let recognition = null;
    let isRecording = false;

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'zh-TW';

      rec.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript;
          }
        }
        if (transcript) {
          const editor = document.getElementById('noteContent');
          editor.innerHTML += (editor.innerHTML ? '<br>' : '') + transcript;
        }
      };

      rec.onerror = (event) => {
        console.error('語音辨識錯誤：', event.error);
        alert('🎙️ 語音辨識錯誤：' + event.error + '\n請確認您已授權麥克風存取權限。');
        stopRecording();
      };

      rec.onend = () => {
        if (isRecording) stopRecording();
      };

      return rec;
    }

    function toggleVoiceRecognition() {
      if (!recognition) {
        recognition = initSpeechRecognition();
      }

      if (!recognition) {
        return alert('⚠️ 您的瀏覽器不支援 Web Speech 語音 API。\n如果您使用手機，建議直接點擊手機輸入法鍵盤右下角的「🎙️ 麥克風」進行語音輸入，效果最佳！');
      }

      const btn = document.getElementById('voiceBtn');

      if (isRecording) {
        stopRecording();
      } else {
        try {
          isRecording = true;
          recognition.start();
          btn.innerText = '🔴 錄音中...';
          btn.classList.add('recording');
        } catch (e) {
          alert('無法啟動錄音：' + e.message);
          stopRecording();
        }
      }
    }

    function stopRecording() {
      isRecording = false;
      const btn = document.getElementById('voiceBtn');
      if (btn) {
        btn.innerText = '🎙️ 語音輸入';
        btn.classList.remove('recording');
      }
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function openSearchModal() { const query = prompt('請輸入搜尋關鍵字：'); if (query) alert('搜尋：' + query); }
    function openTagModal() { document.getElementById('tagModal').style.display = 'flex'; }
    function closeTagModal() { document.getElementById('tagModal').style.display = 'none'; }

    function mobileQuickAdd() {
      openQuickAddModal();
    }
  </script>
