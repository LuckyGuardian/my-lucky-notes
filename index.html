<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅韻知識庫</title>
  <style>
    :root {
      --bg-main: #f2ebe1;       /* 淺咖啡古籍宣紙底色 */
      --bg-panel: #fcf9f2;      /* 暖白米色面板 */
      --bg-card: #e8ded1;       /* 淺褐卡片色 */
      --accent-blue: #2b5b84;    /* 典雅青藍色 */
      --accent-blue-hover: #1f4363;
      --accent-red: #a84842;     /* 朱砂紅 */
      --text-main: #2c2a29;     /* 墨黑字體 */
      --text-sub: #6e675f;      /* 灰褐色字體 */
      --border-color: #d8cdbe;  /* 柔和竹簡邊框 */
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; 
    }
    
    body { 
      display: flex; 
      height: 100vh; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
      padding: 12px; 
      gap: 12px; 
    }
    
    /* 側邊欄 */
    .sidebar { 
      width: 210px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 20px 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      border: 1px solid var(--border-color); 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
    }
    
    .sidebar h3 { 
      font-size: 1.15rem; 
      color: var(--accent-blue); 
      margin-bottom: 10px; 
      font-weight: bold;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--accent-blue);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .menu-item { 
      padding: 10px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      color: var(--text-sub); 
      transition: 0.2s; 
      font-size: 0.95rem; 
      font-weight: bold;
    }
    
    .menu-item.active, .menu-item:hover { 
      background-color: var(--bg-card); 
      color: var(--accent-blue); 
      border-left: 4px solid var(--accent-blue);
    }

    /* 筆記列表 */
    .note-list-panel { 
      width: 270px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
    }
    
    .list-header { 
      padding: 16px; 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background-color: var(--bg-main);
    }
    
    .list-header h4 { 
      color: var(--text-main); 
      font-size: 1rem;
      letter-spacing: 1px;
    }
    
    .btn-add { 
      background: var(--accent-blue); 
      color: white; 
      border: none; 
      padding: 6px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.9rem;
      transition: 0.2s; 
    }
    
    .btn-add:hover { 
      background: var(--accent-blue-hover); 
    }
    
    .note-items { 
      overflow-y: auto; 
      flex: 1; 
      padding: 10px; 
    }
    
    .note-item { 
      padding: 12px 14px; 
      border-radius: 6px; 
      margin-bottom: 8px; 
      cursor: pointer; 
      background-color: #ffffff; 
      border: 1px solid var(--border-color); 
      transition: 0.2s; 
    }
    
    .note-item:hover { 
      border-color: var(--accent-blue); 
      background-color: var(--bg-main); 
    }
    
    .note-item h4 { 
      font-size: 0.95rem; 
      margin-bottom: 6px; 
      color: var(--text-main); 
    }
    
    .note-item p { 
      font-size: 0.85rem; 
      color: var(--text-sub); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    /* 編輯器區域 */
    .editor-panel { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 25px; 
      border: 1px solid var(--border-color); 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
      overflow-y: auto;
    }
    
    .editor-tools { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 15px; 
      justify-content: flex-end; 
      flex-wrap: wrap;
    }
    
    .btn-tool { 
      background: #ffffff; 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 6px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.85rem;
      transition: 0.2s; 
    }
    
    .btn-tool:hover { 
      background-color: var(--bg-main); 
      border-color: var(--accent-blue);
    }

    .btn-voice {
      background-color: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .btn-voice.recording {
      background-color: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    
    .input-title { 
      background: transparent; 
      border: none; 
      border-bottom: 2px solid var(--border-color);
      color: var(--accent-blue); 
      font-size: 1.5rem; 
      font-weight: bold; 
      margin-bottom: 20px; 
      padding-bottom: 8px;
      outline: none; 
    }
    
    .input-content { 
      min-height: 250px; 
      background: transparent; 
      border: none; 
      color: var(--text-main); 
      font-size: 1.05rem; 
      line-height: 1.8; 
      resize: vertical; 
      outline: none; 
    }

    /* 圖片預覽區塊 */
    .image-section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
    }

    .image-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .image-section-header h5 {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .image-preview-container {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .image-preview-box {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      background-color: var(--bg-card);
    }

    .image-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-delete-img {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(168, 72, 66, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 767px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-around; }
      .note-list-panel { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>🦫 雅韻知識庫</h3>
    <div class="menu-item active">📖 英文筆記</div>
    <div class="menu-item">💼 工作筆記</div>
  </div>

  <div class="note-list-panel">
    <div class="list-header">
      <h4>📑 筆記清單</h4>
      <button class="btn-add" onclick="createNote()">+ 新增</button>
    </div>
    <div class="note-items" id="noteItems">
      <div class="note-item" onclick="loadEnglishSample()">
        <h4>🔤 英文句型與搭配詞範本</h4>
        <p>點擊載入職場 Email 萬用句型與單字卡範本...</p>
      </div>
      <div class="note-item" onclick="loadWorkSample()">
        <h4>📌 工作會議與任務範本</h4>
        <p>點擊載入標準職場會議紀錄與待辦事項模板...</p>
      </div>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-tools">
      <button class="btn-tool btn-voice" id="voiceBtn" onclick="toggleVoiceRecognition()">🎙️ 語音輸入</button>
      <button class="btn-tool" onclick="document.getElementById('imageInput').click()">🖼️ 上傳圖片</button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
      <button class="btn-tool" onclick="applyEnglishTemplate()">🔤 帶入英文範本</button>
      <button class="btn-tool" onclick="applyWorkTemplate()">📋 帶入工作範本</button>
      <button class="btn-tool" onclick="saveNote()">💾 儲存筆記</button>
      <button class="btn-tool" style="color: var(--accent-red);" onclick="deleteNote()">🗑️ 刪除筆記</button>
    </div>
    <input type="text" id="noteTitle" class="input-title" value="🔤 英文句型與搭配詞範本" placeholder="請輸入標題...">
    <textarea id="noteContent" class="input-content" placeholder="在此記錄知識與思考..."></textarea>

    <!-- 📷 筆記附件圖片展示區 -->
    <div class="image-section">
      <div class="image-section-header">
        <h5>📷 筆記圖片附件</h5>
      </div>
      <div class="image-preview-container" id="imageContainer"></div>
    </div>
  </div>

  <script>
    let currentImages = [];

    const englishTemplate = `🔤 [學習主題/情境名稱] (範例：職場 Email 跟進)

【一、 萬用句型 / 情境短語】
* 句型 1：I wanted to check in on the status of [專案/事項].
  (中譯：我想確認一下 [專案/事項] 的目前進度。)
* 句型 2：Just a gentle reminder regarding [事項].
  (中譯：溫馨提醒一下關於 [事項]。)

【二、 核心單字與搭配詞 (Collocations)】
* 核心詞：Follow up (v.) 跟進
  * 常見搭配：follow up on something
  * 實用例句：I will follow up on this issue tomorrow.

【三、 避坑指南 (台式英文校正)】
* ❌ 錯誤：I very like this project.
* ⭕ 正確：I really like this project. / I like this project very much.`;

    const workTemplate = `📌 [專案/會議名稱] 紀錄

【一、 核心目標與結論】
* 本次會議要解決的最重要問題：
* 最終決議與共識：

【二、 Action Items (待辦追蹤)】
[ ] 任務 A (負責人 / 預計完成日)
[ ] 任務 B (負責人 / 預計完成日)

【三、 詳細過程與背景資料】
* 討論細節：
* 參考數據與連結：`;

    document.getElementById('noteContent').value = englishTemplate;

    function createNote() {
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
      currentImages = [];
      renderImages();
      document.getElementById('noteTitle').focus();
    }

    /* 📷 圖片上傳處理 */
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImages.push(e.target.result);
          renderImages();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage(index) {
      currentImages.splice(index, 1);
      renderImages();
    }

    function renderImages() {
      const container = document.getElementById('imageContainer');
      container.innerHTML = '';
      currentImages.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'image-preview-box';
        box.innerHTML = `
          <img src="${src}" alt="筆記圖片">
          <button class="btn-delete-img" onclick="removeImage(${idx})">✕</button>
        `;
        container.appendChild(box);
      });
    }

    function applyEnglishTemplate() {
      if (confirm('是否載入「英文句型範本」？')) {
        document.getElementById('noteTitle').value = '🔤 [學習主題/情境名稱]';
        document.getElementById('noteContent').value = englishTemplate;
      }
    }

    function applyWorkTemplate() {
      if (confirm('是否載入「工作會議範本」？')) {
        document.getElementById('noteTitle').value = '📌 [專案/會議名稱] 紀錄';
        document.getElementById('noteContent').value = workTemplate;
      }
    }

    function selectNote(title, content) {
      document.getElementById('noteTitle').value = title;
      document.getElementById('noteContent').value = content;
      currentImages = [];
      renderImages();
    }

    function loadEnglishSample() {
      selectNote('🔤 英文句型與搭配詞範本', englishTemplate);
    }

    function loadWorkSample() {
      selectNote('📌 工作會議與任務範本', workTemplate);
    }

    function saveNote() {
      const title = document.getElementById('noteTitle').value || '未命名筆記';
      const content = document.getElementById('noteContent').value;
      
      const container = document.getElementById('noteItems');
      const newItem = document.createElement('div');
      newItem.className = 'note-item';
      newItem.onclick = () => selectNote(title, content);
      newItem.innerHTML = `<h4>${title}</h4><p>${content}</p>`;
      
      container.prepend(newItem);
      alert('筆記已成功儲存！');
    }

    function deleteNote() {
      if (confirm('確定要刪除此篇筆記嗎？')) {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        currentImages = [];
        renderImages();
      }
    }

    /* 🎙️ 語音轉文字功能 */
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-TW';

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript;
          }
        }
        if (transcript) {
          const textarea = document.getElementById('noteContent');
          textarea.value += (textarea.value ? '\n' : '') + transcript;
        }
      };

      recognition.onerror = (event) => {
        console.error('語音辨識錯誤：', event.error);
        stopRecording();
      };

      recognition.onend = () => {
        if (isRecording) {
          recognition.start();
        }
      };
    }

    function toggleVoiceRecognition() {
      if (!recognition) {
        alert('您的瀏覽器不支援語音辨識，建議使用 Chrome 或 Edge 瀏覽器開啟！');
        return;
      }

      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    function startRecording() {
      isRecording = true;
      recognition.start();
      const btn = document.getElementById('voiceBtn');
      btn.innerText = '🔴 錄音辨識中...';
      btn.classList.add('recording');
    }

    function stopRecording() {
      isRecording = false;
      if (recognition) recognition.stop();
      const btn = document.getElementById('voiceBtn');
      btn.innerText = '🎙️ 語音輸入';
      btn.classList.remove('recording');
    }
  </script>
</body>
</html>
