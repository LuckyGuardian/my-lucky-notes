<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雅韻知識庫</title>
  <style>
    :root {
      --bg-main: #f2ebe1;       /* 淺咖啡古籍宣紙底色 */
      --bg-panel: #fcf9f2;      /* 暖白米色面板 */
      --bg-card: #e8ded1;       /* 淺褐卡片色 */
      --accent-blue: #2b5b84;    /* 典雅青藍色 */
      --accent-blue-hover: #1f4363;
      --accent-red: #a84842;     /* 朱砂紅 */
      --text-main: #2c2a29;     /* 墨黑字體 */
      --text-sub: #6e675f;      /* 灰褐色字體 */
      --border-color: #d8cdbe;  /* 柔和竹簡邊框 */
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; 
    }
    
    body { 
      display: flex; 
      height: 100vh; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
      padding: 12px; 
      gap: 12px; 
    }
    
    /* 側邊欄 */
    .sidebar { 
      width: 210px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 20px 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      border: 1px solid var(--border-color); 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
      position: relative;
      overflow: hidden;
    }
    
    .sidebar h3 { 
      font-size: 1.15rem; 
      color: var(--accent-blue); 
      margin-bottom: 10px; 
      font-weight: bold;
      letter-spacing: 1px;
      border-bottom: 2px solid var(--accent-blue);
      padding-bottom: 8px;
    }
    
    .menu-item { 
      padding: 10px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      color: var(--text-sub); 
      transition: 0.2s; 
      font-size: 0.95rem; 
      font-weight: bold;
      z-index: 1;
    }
    
    .menu-item.active, .menu-item:hover { 
      background-color: var(--bg-card); 
      color: var(--accent-blue); 
      border-left: 4px solid var(--accent-blue);
    }

    /* 左下角彼岸花圖案 */
    .spider-lily {
      position: absolute;
      bottom: -10px;
      left: -10px;
      width: 130px;
      height: 130px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    /* 筆記列表 */
    .note-list-panel { 
      width: 270px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
    }
    
    .list-header { 
      padding: 16px; 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background-color: var(--bg-main);
    }
    
    .list-header h4 { 
      color: var(--text-main); 
      font-size: 1rem;
      letter-spacing: 1px;
    }
    
    .btn-add { 
      background: var(--accent-blue); 
      color: white; 
      border: none; 
      padding: 6px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.9rem;
      transition: 0.2s; 
    }
    
    .btn-add:hover { 
      background: var(--accent-blue-hover); 
    }
    
    .note-items { 
      overflow-y: auto; 
      flex: 1; 
      padding: 10px; 
    }
    
    .note-item { 
      padding: 12px 14px; 
      border-radius: 6px; 
      margin-bottom: 8px; 
      cursor: pointer; 
      background-color: #ffffff; 
      border: 1px solid var(--border-color); 
      transition: 0.2s; 
    }
    
    .note-item:hover { 
      border-color: var(--accent-blue); 
      background-color: var(--bg-main); 
    }
    
    .note-item h4 { 
      font-size: 0.95rem; 
      margin-bottom: 6px; 
      color: var(--text-main); 
    }
    
    .note-item p { 
      font-size: 0.85rem; 
      color: var(--text-sub); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    /* 編輯器區域 */
    .editor-panel { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 25px; 
      border: 1px solid var(--border-color); 
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.03);
    }
    
    .editor-tools { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 15px; 
      justify-content: flex-end; 
      flex-wrap: wrap;
    }
    
    .btn-tool { 
      background: #ffffff; 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 6px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.85rem;
      transition: 0.2s; 
    }
    
    .btn-tool:hover { 
      background-color: var(--bg-main); 
      border-color: var(--accent-blue);
    }
    
    .input-title { 
      background: transparent; 
      border: none; 
      border-bottom: 2px solid var(--border-color);
      color: var(--accent-blue); 
      font-size: 1.5rem; 
      font-weight: bold; 
      margin-bottom: 20px; 
      padding-bottom: 8px;
      outline: none; 
    }
    
    .input-content { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: var(--text-main); 
      font-size: 1.05rem; 
      line-height: 1.8; 
      resize: none; 
      outline: none; 
    }

    @media (max-width: 767px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-around; }
      .note-list-panel { width: 100%; height: 180px; }
      .spider-lily { display: none; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>📜 雅韻知識庫</h3>
    <div class="menu-item active">📖 英文筆記</div>
    <div class="menu-item">💼 工作筆記</div>
    
    <!-- 彼岸花 SVG 圖案 -->
    <svg class="spider-lily" viewBox="0 0 100 100" fill="#a84842">
      <path d="M50,90 C50,70 45,50 30,35 C20,25 5,20 0,22 C10,28 22,35 28,45 C35,55 38,70 40,90 Z" />
      <path d="M50,90 C52,70 58,50 72,35 C82,25 97,20 100,22 C90,28 78,35 72,45 C65,55 62,70 60,90 Z" />
      <path d="M50,90 C48,65 35,45 20,28 C10,18 -2,12 0,10 C8,18 20,28 28,38 C38,50 42,68 45,90 Z" />
      <path d="M50,90 C52,65 65,45 80,28 C90,18 102,12 100,10 C92,18 80,28 72,38 C62,50 58,68 55,90 Z" />
      <circle cx="0" cy="22" r="2" />
      <circle cx="100" cy="22" r="2" />
      <circle cx="0" cy="10" r="2" />
      <circle cx="100" cy="10" r="2" />
    </svg>
  </div>

  <div class="note-list-panel">
    <div class="list-header">
      <h4>📑 筆記清單</h4>
      <button class="btn-add" onclick="createNote()">+ 新增</button>
    </div>
    <div class="note-items" id="noteItems">
      <div class="note-item" onclick="loadEnglishSample()">
        <h4>🔤 英文句型與搭配詞範本</h4>
        <p>點擊載入職場 Email 萬用句型與單字卡範本...</p>
      </div>
      <div class="note-item" onclick="loadWorkSample()">
        <h4>📌 工作會議與任務範本</h4>
        <p>點擊載入標準職場會議紀錄與待辦事項模板...</p>
      </div>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-tools">
      <button class="btn-tool" onclick="applyEnglishTemplate()">🔤 帶入英文範本</button>
      <button class="btn-tool" onclick="applyWorkTemplate()">📋 帶入工作範本</button>
      <button class="btn-tool" onclick="saveNote()">💾 儲存筆記</button>
      <button class="btn-tool" style="color: var(--accent-red);" onclick="deleteNote()">🗑️ 刪除筆記</button>
    </div>
    <input type="text" id="noteTitle" class="input-title" value="🔤 英文句型與搭配詞範本" placeholder="請輸入標題...">
    <textarea id="noteContent" class="input-content" placeholder="在此記錄知識與思考..."></textarea>
  </div>

  <script>
    const englishTemplate = `🔤 [學習主題/情境名稱] (範例：職場 Email 跟進)

【一、 萬用句型 / 情境短語】
* 句型 1：I wanted to check in on the status of [專案/事項].
  (中譯：我想確認一下 [專案/事項] 的目前進度。)
* 句型 2：Just a gentle reminder regarding [事項].
  (中譯：溫馨提醒一下關於 [事項]。)

【二、 核心單字與搭配詞 (Collocations)】
* 核心詞：Follow up (v.) 跟進
  * 常見搭配：follow up on something
  * 實用例句：I will follow up on this issue tomorrow.

【三、 避坑指南 (台式英文校正)】
* ❌ 錯誤：I very like this project.
* ⭕ 正確：I really like this project. / I like this project very much.`;

    const workTemplate = `📌 [專案/會議名稱] 紀錄

【一、 核心目標與結論】
* 本次會議要解決的最重要問題：
* 最終決議與共識：

【二、 Action Items (待辦追蹤)】
[ ] 任務 A (負責人 / 預計完成日)
[ ] 任務 B (負責人 / 預計完成日)

【三、 詳細過程與背景資料】
* 討論細節：
* 參考數據與連結：`;

    // 預設寫入英文範本
    document.getElementById('noteContent').value = englishTemplate;

    function createNote() {
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
      document.getElementById('noteTitle').focus();
    }

    function applyEnglishTemplate() {
      if (confirm('是否載入「英文句型範本」？')) {
        document.getElementById('noteTitle').value = '🔤 [學習主題/情境名稱]';
        document.getElementById('noteContent').value = englishTemplate;
      }
    }

    function applyWorkTemplate() {
      if (confirm('是否載入「工作會議範本」？')) {
        document.getElementById('noteTitle').value = '📌 [專案/會議名稱] 紀錄';
        document.getElementById('noteContent').value = workTemplate;
      }
    }

    function selectNote(title, content) {
      document.getElementById('noteTitle').value = title;
      document.getElementById('noteContent').value = content;
    }

    function loadEnglishSample() {
      selectNote('🔤 英文句型與搭配詞範本', englishTemplate);
    }

    function loadWorkSample() {
      selectNote('📌 工作會議與任務範本', workTemplate);
    }

    function saveNote() {
      const title = document.getElementById('noteTitle').value || '未命名筆記';
      const content = document.getElementById('noteContent').value;
      
      const container = document.getElementById('noteItems');
      const newItem = document.createElement('div');
      newItem.className = 'note-item';
      newItem.onclick = () => selectNote(title, content);
      newItem.innerHTML = `<h4>${title}</h4><p>${content}</p>`;
      
      container.prepend(newItem);
      alert('筆記已成功儲存！');
    }

    function deleteNote() {
      if (confirm('確定要刪除此篇筆記嗎？')) {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
      }
    }
  </script>
</body>
</html>
