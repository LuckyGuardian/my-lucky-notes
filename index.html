<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>典藏知識庫</title>
  <style>
    :root {
      --bg-main: #141312;       /* 深墨灰背景 */
      --bg-panel: #1c1b18;      /* 墨黑面板 */
      --bg-card: #282623;       /* 粗礫石色 */
      --accent-red: #9e2a2b;     /* 硃砂紅 */
      --accent-hover: #b83234;   /* 亮硃砂 */
      --accent-gold: #c9a227;    /* 沉香金 */
      --text-main: #f4f0ea;     /* 宣紙米白 */
      --text-sub: #a39e93;      /* 煙灰字體 */
      --border-color: #38342e;  /* 典雅木紋邊框 */
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; 
    }
    
    body { 
      display: flex; 
      height: 100vh; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      overflow: hidden; 
      padding: 12px; 
      gap: 12px; 
    }
    
    /* 側邊欄 */
    .sidebar { 
      width: 210px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 20px 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      border: 1px solid var(--border-color); 
    }
    
    .sidebar h3 { 
      font-size: 1.15rem; 
      color: var(--accent-gold); 
      margin-bottom: 10px; 
      font-weight: bold;
      letter-spacing: 1px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 8px;
    }
    
    .menu-item { 
      padding: 10px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      color: var(--text-sub); 
      transition: 0.2s; 
      font-size: 0.95rem; 
      font-weight: bold;
    }
    
    .menu-item.active, .menu-item:hover { 
      background-color: var(--bg-card); 
      color: var(--text-main); 
      border-left: 3px solid var(--accent-gold);
    }

    /* 筆記列表 */
    .note-list-panel { 
      width: 270px; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }
    
    .list-header { 
      padding: 16px; 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background-color: rgba(255, 255, 255, 0.02);
    }
    
    .list-header h4 { 
      color: var(--text-main); 
      font-size: 1rem;
      letter-spacing: 1px;
    }
    
    .btn-add { 
      background: var(--accent-red); 
      color: white; 
      border: none; 
      padding: 6px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.9rem;
      transition: 0.2s; 
    }
    
    .btn-add:hover { 
      background: var(--accent-hover); 
    }
    
    .note-items { 
      overflow-y: auto; 
      flex: 1; 
      padding: 10px; 
    }
    
    .note-item { 
      padding: 12px 14px; 
      border-radius: 6px; 
      margin-bottom: 8px; 
      cursor: pointer; 
      background-color: var(--bg-main); 
      border: 1px solid var(--border-color); 
      transition: 0.2s; 
    }
    
    .note-item:hover { 
      border-color: var(--accent-gold); 
      background-color: var(--bg-card); 
    }
    
    .note-item h4 { 
      font-size: 0.95rem; 
      margin-bottom: 6px; 
      color: var(--text-main); 
    }
    
    .note-item p { 
      font-size: 0.85rem; 
      color: var(--text-sub); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    /* 編輯器區域 */
    .editor-panel { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background-color: var(--bg-panel); 
      border-radius: 8px; 
      padding: 25px; 
      border: 1px solid var(--border-color); 
    }
    
    .editor-tools { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 15px; 
      justify-content: flex-end; 
    }
    
    .btn-tool { 
      background: var(--bg-card); 
      color: var(--text-main); 
      border: 1px solid var(--border-color); 
      padding: 6px 16px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.9rem;
      transition: 0.2s; 
    }
    
    .btn-tool:hover { 
      background-color: var(--border-color); 
      border-color: var(--accent-gold);
    }
    
    .input-title { 
      background: transparent; 
      border: none; 
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-gold); 
      font-size: 1.5rem; 
      font-weight: bold; 
      margin-bottom: 20px; 
      padding-bottom: 8px;
      outline: none; 
    }
    
    .input-content { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: var(--text-main); 
      font-size: 1.05rem; 
      line-height: 1.8; 
      resize: none; 
      outline: none; 
    }

    @media (max-width: 767px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; flex-direction: row; justify-content: space-around; }
      .note-list-panel { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>📜 典藏知識庫</h3>
    <div class="menu-item active">📖 英文筆記</div>
    <div class="menu-item">💼 工作筆記</div>
  </div>

  <div class="note-list-panel">
    <div class="list-header">
      <h4>📑 筆記清單</h4>
      <button class="btn-add" onclick="createNote()">+ 新增</button>
    </div>
    <div class="note-items" id="noteItems">
      <div class="note-item" onclick="selectNote('卷首語', '點擊右上角「新增」按鈕即可撰寫新筆記。')">
        <h4>卷首語</h4>
        <p>點擊右上角「新增」按鈕即可撰寫新筆記。</p>
      </div>
    </div>
  </div>

  <div class="editor-panel">
    <div class="editor-tools">
      <button class="btn-tool" onclick="saveNote()">💾 封存儲存</button>
      <button class="btn-tool" style="color: #e63946;" onclick="deleteNote()">🗑️ 移除筆記</button>
    </div>
    <input type="text" id="noteTitle" class="input-title" value="卷首語" placeholder="請輸入標題...">
    <textarea id="noteContent" class="input-content" placeholder="在此記錄知識與思考...">點擊右上角「新增」按鈕即可撰寫新筆記。</textarea>
  </div>

  <script>
    function createNote() {
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
      document.getElementById('noteTitle').focus();
    }

    function selectNote(title, content) {
      document.getElementById('noteTitle').value = title;
      document.getElementById('noteContent').value = content;
    }

    function saveNote() {
      const title = document.getElementById('noteTitle').value || '未命名筆記';
      const content = document.getElementById('noteContent').value;
      
      const container = document.getElementById('noteItems');
      const newItem = document.createElement('div');
      newItem.className = 'note-item';
      newItem.onclick = () => selectNote(title, content);
      newItem.innerHTML = `<h4>${title}</h4><p>${content}</p>`;
      
      container.prepend(newItem);
      alert('筆記已成功封存儲存！');
    }

    function deleteNote() {
      if (confirm('確定要移除此篇筆記嗎？')) {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
      }
    }
  </script>
</body>
</html>
